# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  [push]

permissions:
  contents: read

jobs:
  run_test_suite:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install Qt system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Test with pytest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        QT_QPA_PLATFORM: offscreen
      run: |
        pytest --cov-report html test --cov=.\
    - name: Static analysis
      run: |
        pylint --disable line-too-long --disable wrong-import-order --disable no-name-in-module --exit-zero ./src
