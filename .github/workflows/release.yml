# Alla pubblicazione di un tag v* (es. v1.0.0) costruisce l'eseguibile Windows e lo allega alla GitHub Release
# Lanciato a mano (Run workflow) costruisce lo zip senza pubblicare nulla: resta come artifact da verificare

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  windows_executable:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    # il bootloader precompilato di PyInstaller e' identico in ogni exe che lo usa, compreso molto malware:
    # gli antivirus lo segnalano come falso positivo. Compilandolo qui l'exe non e' piu' quello "noto".
    - name: Build PyInstaller from source (bootloader included)
      shell: pwsh
      run: |
        git clone --depth 1 --branch "v$env:PYINSTALLER_VERSION" https://github.com/pyinstaller/pyinstaller.git "$env:RUNNER_TEMP/pyinstaller"
        Push-Location "$env:RUNNER_TEMP/pyinstaller/bootloader"
        python ./waf all
        if ($LASTEXITCODE -ne 0) { throw "compilazione del bootloader fallita" }
        Pop-Location
        pip install "$env:RUNNER_TEMP/pyinstaller"
    - name: Build executable
      env:
        GRAPHAPP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: pyinstaller graphapp.spec --noconfirm
    - name: Package
      shell: pwsh
      run: Compress-Archive -Path dist/GraphApp -DestinationPath "GraphApp-${{ github.ref_name }}-windows.zip"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GraphApp-windows
        path: GraphApp-${{ github.ref_name }}-windows.zip
    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: GraphApp-${{ github.ref_name }}-windows.zip
        body_path: CHANGELOG.md
